<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', sans-serif; }
        body { background: #f9f9f9; color: #111; padding: 4rem 2rem; }
        header { max-width: 1200px; margin: 0 auto 4rem auto; }
        header h1 { font-size: 3rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 1rem; }
        header p { font-size: 1.2rem; color: #666; max-width: 600px; line-height: 1.6; }
        
        /* Portfolio Grid */
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .project-card { background: #fff; border: 1px solid #eee; overflow: hidden; cursor: pointer; transition: transform 0.3s ease; }
        .project-card:hover { transform: translateY(-5px); }
        .project-image { width: 100%; height: 250px; background: #ddd; object-fit: cover; }
        .project-info { padding: 1.5rem; }
        .project-info h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        .project-info p { color: #888; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }

        /* Lightbox Popup */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .lightbox img { max-width: 90%; max-height: 80vh; }
    </style>
</head>
<body>

    <header>
        <h1>Your Name</h1>
        <p>Graphic Designer & Creative Director specializing in branding, digital layouts, and visual identity systems.</p>
    </header>

    <main class="portfolio-grid">
        <!-- Project 1 -->
        <div class="project-card" onclick="openLightbox('project1.jpg')">
            <!-- Replace 'project1.jpg' with your actual image path later -->
            <div class="project-image"></div> 
            <div class="project-info">
                <p>Branding</p>
                <h3>Editorial Brand Identity</h3>
            </div>
        </div>

        <!-- Project 2 -->
        <div class="project-card" onclick="openLightbox('project2.jpg')">
            <div class="project-image"></div>
            <div class="project-info">
                <p>Digital Design</p>
                <h3>Web Interface System</h3>
            </div>
        </div>

        <!-- Project 3 -->
        <div class="project-card" onclick="openLightbox('project3.jpg')">
            <div class="project-image"></div>
            <div class="project-info">
                <p>Packaging</p>
                <h3>Sustainable Goods Concept</h3>
            </div>
        </div>
    </main>

    <!-- Popup Window -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Enlarged view">
    </div>

    <script src="script.js"></script>
</body>
</html>

</html>
