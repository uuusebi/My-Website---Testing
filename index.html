<html>
<head>
    <title>hello world</title>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <p>Click the button below to trigger JavaScript!</p>
    
    <!-- This is HTML -->
    <button id="magicButton">Click Me!</button>

    <!-- This is JavaScript -->
    <script>
        document.getElementById("magicButton").addEventListener("click", function() {
            alert("Hello! This message was brought to you by JavaScript.");
        });
    </script>
</body>
</html>
