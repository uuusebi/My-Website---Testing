<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebastian Nunez</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Full-screen title. hero.js animates it. The empty <p> is room for a tagline. -->
    <header class="hero">
        <h1>Sebastian Nunez</h1>
        <p>Graphic Design + Animation + Web Development</p>
    </header>

    <!-- script.js fills this with one card per project in projects.json -->
    <main class="portfolio-grid"></main>

    <!-- Popup window. Its contents are filled in by script.js -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-meta">
            <span id="meta-title"></span>
            <span id="meta-type"></span>
            <span id="meta-date"></span>
        </div>
        <img id="lightbox-img" src="" alt="Enlarged view" style="display: none;">
        <video id="lightbox-video" controls autoplay muted loop playsinline style="display: none;" onclick="event.stopPropagation()"></video>        
        <p id="lightbox-caption"></p>
    </div>

    <!-- Each script loads once, here at the bottom. nav.js must NOT also be in the <body> above. -->
    <script src="nav.js"></script>
    <script src="hero.js"></script>
    <script src="script.js"></script>
</body>
</html>
