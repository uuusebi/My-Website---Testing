<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Portfolio</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sebastian Nunez</h1>
        <p>Graphic Designer & Creative Director specializing in branding, digital layouts, and visual identity systems.</p>
    </header>

    <main class="portfolio-grid">

        <!-- Project 1 -->
        	<div class="project-card" onclick="openLightbox('images/ilyvirato/dynama/dynama_2.png','Dynama is so freaking cool!')">
			<img src="images/ilyvirato/dynama/dynama_2.png" class="project-image" alt="Dynama 2 Graphic Design">
            	<div class="project-info">
                	<p>Album Cover Art</p>
                	<h3>dynamo for ilyvirato</h3>
            </div>
        </div>

        <!-- Project 2 -->
        	<div class="project-card" onclick="openLightbox('images/ilyvirato/heavenly/heavenly_cover.png','so heavenly...')">
			<img src="images/ilyvirato/heavenly/heavenly_cover.png" class="project-image" alt='Heavenly Graphic Design">
            	<div class="project-info">
                	<p>album cover</p>
                	<h3>heavenly for ilyvirato</h3>
            </div>
        </div>

        <!-- Project 3 -->
        <div class="project-card" onclick="openLightbox('project3.jpg')">
            <div class="project-image"></div>
            <div class="project-info">
                <p>Packaging</p>
                <h3>Sustainable Goods Concept</h3>
            </div>
        </div>
    </main>

    <!-- Popup Window -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Enlarged view">
	<p id="lightbox-caption"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
