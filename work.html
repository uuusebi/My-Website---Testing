<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index | Sebastian Nunez</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- The Index: every project, in two views. data-view="gallery" or "list" (script.js
         switches it and keeps it in the URL as ?view=…). style.css shows one view at a time. -->
    <main class="work" id="work" data-view="gallery">

        <!-- Top row: info about the previewed project | project list | filter + view.
             (Gallery view shows all three; List view shows just the title and the options.)
             script.js fills all three from projects.json.
             The info box: .work-info is the container, and each child is named work-info-<what it is>.
             The ids match the classes: script.js finds the elements by id,
             style.css uses the classes. -->
        <section class="work-top">
            <div class="work-info" aria-live="polite">
                <h1 id="work-info-title" class="work-info-title">Index</h1>
                <p id="work-info-meta" class="work-info-meta"></p>
                <p id="work-info-text" class="work-info-text"></p>
            </div>

            <nav class="work-list" aria-label="Projects">
                <span class="work-label">Selected Work:</span>
                <ul id="work-list"></ul>
            </nav>

            <div class="work-options">
                <div class="work-filter">
                    <span class="work-label">Filter:</span>
                    <ul id="work-filter"></ul>
                </div>

                <!-- Gallery = big preview + thumbnails, List = rows with a preview that follows the cursor -->
                <div class="work-view">
                    <span class="work-label">View:</span>
                    <ul id="work-view">
                        <li><button type="button" data-view="gallery">Gallery</button></li>
                        <li><button type="button" data-view="list">List</button></li>
                    </ul>
                </div>
            </div>
        </section>

        <!-- ===== Gallery view ===== -->
        <div class="work-gallery" id="work-gallery">

            <!-- Preview stage: shows the hovered project. Clicking it opens the project page.
                 Hidden from screen readers and the Tab key because the list and thumbnails already link there -->
            <section class="work-stage" aria-hidden="true">
                <a id="stage-link" href="#" tabindex="-1">
                    <img id="stage-img" alt="">
                    <video id="stage-video" muted loop playsinline hidden></video>
                </a>
            </section>

            <!-- Thumbnail grid: every image of every project -->
            <section class="work-grid" id="work-grid"></section>
        </div>

        <!-- ===== List view ===== one row per project, filled by script.js -->
        <div class="work-rows" id="work-rows">
            <div class="work-rows-row work-rows-head">
                <span>Title</span>
                <span>Client</span>
                <span>Type</span>
                <span>Date</span>
            </div>
        </div>

    </main>

    <!-- Each script loads once, here at the bottom. -->
    <script src="nav.js"></script>
    <script src="script.js"></script>
</body>
</html>
